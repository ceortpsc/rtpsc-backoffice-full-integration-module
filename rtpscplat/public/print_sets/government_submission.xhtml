<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>GOVERNMENT SUBMISSION SET</title>
    <style type="text/css">
        @page {
            size: letter;
            margin: 10mm;
            @bottom-center {
                content: "FORMSET OMD-1545 — OFFICIAL SUBMISSION PARITY";
                font-family: Arial, sans-serif;
                font-size: 7pt;
            }
        }
        body { font-family: Arial, sans-serif; background-color: #fff; padding: 10px; }
        .gov-header { border: 2px solid #000; padding: 15px; text-align: center; font-weight: bold; font-size: 14pt; margin-bottom: 20px; }
        .form-line { border-bottom: 1px solid #000; padding: 8px 0; display: block; clear: both; }
        .form-label { font-weight: bold; font-size: 9pt; float: left; }
        .form-value { font-family: Courier, monospace; font-size: 11pt; float: right; font-weight: bold; }
    </style>
</head>
<body>
    <div class="gov-header">DEPARTMENT OF THE TREASURY — INTERNAL REVENUE SERVICE</div>
    
    <div class="form-line">
        <span class="form-label">Taxpayer First Name &amp; Initial</span>
        <span class="form-value">TEENA</span>
    </div>
    <div class="form-line">
        <span class="form-label">Taxpayer Last Name</span>
        <span class="form-value">POWELL</span>
    </div>
    <div class="form-line">
        <span class="form-label">Identifying Number (SSN)</span>
        <span class="form-value">XXX-XX-1104</span>
    </div>
    <div style="clear: both;"></div>
</body>
</html>
