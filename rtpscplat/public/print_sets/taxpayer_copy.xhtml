<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>TAXPAYER COPY - PRINT SET</title>
    <style type="text/css">
        @page {
            size: letter;
            margin: 15mm;
            @bottom-right {
                content: "Taxpayer Copy — Page " counter(page);
                font-family: sans-serif;
                font-size: 8pt;
                color: #64748b;
            }
        }
        body { font-family: sans-serif; font-size: 10pt; color: #0f172a; line-height: 1.4; }
        .watermark-banner { background: #f1f5f9; border: 2px dashed #cbd5e1; text-align: center; padding: 12px; font-weight: bold; color: #475569; font-size: 14px; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        .header-main { border-bottom: 3px double #0f172a; padding-bottom: 10px; margin-bottom: 20px; }
        .header-title { font-size: 20px; font-weight: bold; color: #0f172a; }
        .grid-two { display: table; width: 100%; margin-bottom: 20px; }
        .grid-row { display: table-row; }
        .grid-cell { display: table-cell; width: 50%; padding: 5px; }
        .data-box { border: 1px solid #94a3b8; padding: 12px; background: #fafafa; border-radius: 4px; }
        .label { font-size: 8pt; text-transform: uppercase; color: #475569; font-weight: bold; display: block; }
        .value { font-size: 11pt; font-family: monospace; font-weight: bold; }
    </style>
</head>
<body>
    <div class="watermark-banner">★ CLIENT COPY — DO NOT MAIL TO IRS ★</div>
    
    <div class="header-main">
        <span class="header-title">Vantage Tax Platform — Client Return Archive</span>
        <div style="float: right; text-align: right; font-size: 9pt; color: #475569;">Tax Year: <strong>2025</strong></div>
        <div style="clear: both;"></div>
    </div>

    <div class="grid-two">
        <div class="grid-row">
            <div class="grid-cell">
                <div class="data-box">
                    <span class="label">Taxpayer Name</span>
                    <span class="value">TEENA POWELL</span>
                </div>
            </div>
            <div class="grid-cell">
                <div class="data-box">
                    <span class="label">Social Security Number</span>
                    <span class="value">XXX-XX-1104</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
