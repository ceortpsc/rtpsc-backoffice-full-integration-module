<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ROSS TAX PRO - Bank Products</title>
    <link rel="stylesheet" type="text/css" href="../assets/theme.css" />
</head>
<body>
<div class="app-shell">
    <header class="topbar">
        <div>
            <h1>Bank Products Console</h1>
            <p>Search bank products and pre-configure refund transfer options.</p>
        </div>
        <nav class="nav-links">
            <a data-route="dashboard.xhtml" href="dashboard.xhtml">Dashboard</a>
            <a data-route="return-editor.xhtml" href="return-editor.xhtml">Return Editor</a>
            <a data-route="efile-center.xhtml" href="efile-center.xhtml">E-File Center</a>
            <a data-route="bank-product.xhtml" href="bank-product.xhtml" class="active">Bank Products</a>
            <a data-route="envelope-creator.xhtml" href="envelope-creator.xhtml">Envelope Creator</a>
            <a data-route="signature-pad.xhtml" href="signature-pad.xhtml">Signature Pad</a>
            <a data-route="mef-center.xhtml" href="mef-center.xhtml">MEF Center</a>
        </nav>
    </header>
    <main class="page-content">
        <section class="content-grid">
            <article class="card">
                <h3>Search Bank Product Catalog</h3>
                <div class="form-grid">
                    <label>Search by product, feature, or bank
                        <input id="bank-query" type="text" value="advance" />
                    </label>
                </div>
                <div class="hero-actions">
                    <button class="btn primary" type="button" onclick="searchBank()">Search Bank Products</button>
                </div>
            </article>

            <article class="card">
                <h3>Search Results</h3>
                <div id="bank-output" class="ai-output"></div>
            </article>
        </section>
    </main>
</div>
<script type="text/javascript">
    async function searchBank() {
        const query = document.getElementById('bank-query').value;
        const response = await fetch('/api/bank/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: query })
        });
        const result = await response.json();

        const html = '<p>Matched products: ' + result.total + '</p>'
            + '<ul>' + result.products.map((item) =>
                '<li>' + item.name + ' | ' + item.bank + ' | $' + item.fee.toFixed(2) + '</li>').join('') + '</ul>';
        document.getElementById('bank-output').innerHTML = html;
    }
</script>
<script src="../assets/router.js" type="text/javascript"></script>
</body>
</html>
