<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ROSS TAX PRO - Return Editor</title>
    <link rel="stylesheet" type="text/css" href="../assets/theme.css" />
</head>
<body>
<div class="app-shell">
    <header class="topbar">
        <div>
            <h1>Return Editor</h1>
            <p>Advanced taxpayer enrollment and federal/state interview wizard.</p>
        </div>
        <nav class="nav-links">
            <a data-route="dashboard.xhtml" href="dashboard.xhtml">Dashboard</a>
            <a data-route="return-editor.xhtml" href="return-editor.xhtml" class="active">Return Editor</a>
            <a data-route="efile-center.xhtml" href="efile-center.xhtml">E-File Center</a>
            <a data-route="bank-product.xhtml" href="bank-product.xhtml">Bank Products</a>
            <a data-route="envelope-creator.xhtml" href="envelope-creator.xhtml">Envelope Creator</a>
            <a data-route="signature-pad.xhtml" href="signature-pad.xhtml">Signature Pad</a>
            <a data-route="mef-center.xhtml" href="mef-center.xhtml">MEF Center</a>
        </nav>
    </header>

    <main class="page-content">
        <section class="content-grid">
            <article class="card">
                <h3>Taxpayer Enrollment Questionnaire</h3>
                <form class="form-grid" id="interview-form">
                    <label>Taxpayer Name<input id="taxpayer-name" type="text" value="Jonathan Vance Sterling" /></label>
                    <label>Tax Year<input id="tax-year" type="number" value="2026" /></label>
                    <label>Filing Status
                        <select id="filing-status">
                            <option value="single">Single</option>
                            <option value="married">Married</option>
                            <option value="head-of-household">Head of Household</option>
                        </select>
                    </label>
                    <label>State
                        <select id="state-code">
                            <option value="TX">TX</option>
                            <option value="CA">CA</option>
                            <option value="NY">NY</option>
                            <option value="NJ">NJ</option>
                            <option value="IL">IL</option>
                        </select>
                    </label>
                    <label>Gross Income<input id="gross-income" type="number" value="84125" /></label>
                    <label>Self-Employed Income<input id="self-employed-income" type="number" value="42000" /></label>
                    <label>Education Expenses<input id="education-expenses" type="number" value="3200" /></label>
                    <label>Childcare Expenses<input id="childcare-expenses" type="number" value="1800" /></label>
                    <label>Children<input id="children" type="number" value="1" /></label>
                </form>
                <div class="hero-actions">
                    <button class="btn primary" type="button" onclick="runInterviewWizard()">Run Federal/State Interview Wizard</button>
                    <button class="btn" type="button" onclick="generateManualForms()">Generate Manual Forms</button>
                </div>
            </article>

            <article class="card">
                <h3>Interview Output</h3>
                <div id="questionnaire-output" class="ai-output"></div>
                <div id="wizard-output" class="ai-output"></div>
                <div id="manual-output" class="ai-output"></div>
            </article>
        </section>
    </main>
</div>

<script type="text/javascript">
    function toNumber(id) {
        const value = Number(document.getElementById(id).value || 0);
        return Number.isFinite(value) ? value : 0;
    }

    function getInterviewPayload() {
        return {
            taxpayerName: document.getElementById('taxpayer-name').value,
            taxYear: toNumber('tax-year'),
            filingStatus: document.getElementById('filing-status').value,
            state: document.getElementById('state-code').value,
            grossIncome: toNumber('gross-income'),
            selfEmployedIncome: toNumber('self-employed-income'),
            educationExpenses: toNumber('education-expenses'),
            childcareExpenses: toNumber('childcare-expenses'),
            children: toNumber('children')
        };
    }

    async function runInterviewWizard() {
        const payload = getInterviewPayload();
        const questionnaireRes = await fetch('/api/ai/enrollment-questionnaire', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const wizardRes = await fetch('/api/ai/interview-wizard', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const questionnaire = await questionnaireRes.json();
        const wizard = await wizardRes.json();

        document.getElementById('questionnaire-output').innerHTML =
            '<h4>Enrollment Sections</h4>'
            + '<ul>' + questionnaire.sections.map((section) => '<li>' + section.title + '</li>').join('') + '</ul>';

        document.getElementById('wizard-output').innerHTML =
            '<h4>Wizard Recommended Forms</h4>'
            + '<p>' + wizard.recommendedForms.join(', ') + '</p>'
            + '<h4>Accuracy Checks</h4>'
            + '<ul>' + wizard.accuracyChecks.map((item) => '<li>' + item + '</li>').join('') + '</ul>';
    }

    async function generateManualForms() {
        const payload = {
            forms: ['1040', 'Schedule C', document.getElementById('state-code').value + ' State Return']
        };

        const response = await fetch('/api/ai/manual-forms', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const result = await response.json();
        document.getElementById('manual-output').innerHTML =
            '<h4>Optional Manual Forms</h4>'
            + '<p>' + result.message + '</p>'
            + '<ul>' + result.generatedForms.map((item) => '<li>' + item.form + ' - ' + item.status + '</li>').join('') + '</ul>';
    }
</script>
<script src="../assets/router.js" type="text/javascript"></script>
</body>
</html>
