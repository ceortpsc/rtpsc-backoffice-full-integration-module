<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/rtpsc-theme.css">
    <title>RTPSC Forms Cabinet</title>
    <style>
        :root { --navy:#0F2C59; --gold:#DAC0A3; --eggshell:#F8F4EC; --border:#E5E7EB; --slate:#1F2937; }
        body { margin:0; padding:22px; background:linear-gradient(135deg,var(--rtpsc-eggshell-soft),var(--rtpsc-eggshell)); color:var(--slate); font-family:Segoe UI,system-ui,sans-serif; }
    <title>RTPSC Forms Cabinet</title>
    <style>
        :root { --navy:#0F2C59; --gold:#DAC0A3; --eggshell:#F8F4EC; --border:#E5E7EB; --slate:#1F2937; }
        body { margin:0; padding:22px; background:#F1F5F9; color:var(--slate); font-family:Segoe UI,system-ui,sans-serif; }
        .shell { max-width:1280px; margin:0 auto; }
        header { background:var(--navy); color:white; border-radius:14px; padding:22px 28px; margin-bottom:18px; }
        header p { color:var(--gold); font-weight:700; margin:8px 0 0; }
        nav { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
        nav button { border:1px solid var(--border); border-radius:999px; background:var(--eggshell); color:var(--navy); padding:9px 14px; font-weight:800; }
        .grid { display:grid; grid-template-columns: 1fr 1fr; gap:18px; }
        .panel { background:var(--rtpsc-eggshell-soft); border:1px solid var(--border); border-radius:14px; padding:18px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
        .panel { background:white; border:1px solid var(--border); border-radius:14px; padding:18px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
        input, select, textarea { width:100%; border:1px solid var(--border); border-radius:10px; padding:10px; margin-top:8px; box-sizing:border-box; }
        textarea { min-height:160px; font-family:monospace; }
        .actions { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
        .primary { background:var(--navy); color:white; border:0; border-radius:999px; padding:10px 16px; font-weight:800; }
        .secondary { background:var(--gold); color:var(--navy); border:0; border-radius:999px; padding:10px 16px; font-weight:800; }
        .result { background:#F8FAFC; border:1px solid var(--border); border-radius:10px; padding:12px; margin-top:12px; font-family:monospace; white-space:pre-wrap; }
    </style>
</head>
<body class="rtpsc-shell">
<body>
    <main class="shell">
        <header><h1>RTPSC Forms Cabinet</h1><p>IRS form lookup • filing cabinet catalog • editor interface • RossSign envelope export</p></header>
        <nav><button>Lookup</button><button>Cabinet</button><button>Editor</button><button>eSign Envelope</button><button>Exports</button><button>Settings</button></nav>
        <section class="grid">
            <div class="panel">
                <h2>Form Number Lookup</h2>
                <label>Form number or family<input id="formNumber" placeholder="e.g. 8821, 2848, 1120-S, 1099"></label>
                <label>Tax year<select id="taxYear"><option>2026</option><option>2025</option><option>2024</option></select></label>
                <div class="actions"><button class="primary" id="lookupForm">Lookup Form</button><button class="secondary" id="buildEnvelope">Build eSign Envelope</button></div>
                <div class="result" id="lookupResult">Lookup result will appear here.</div>
            </div>
            <div class="panel">
                <h2>Draft Editor / Export Manifest</h2>
                <textarea id="draftEditor" placeholder="Draft notes, packet checklist, or envelope metadata."></textarea>
                <div class="actions"><button class="primary" id="exportManifest">Export Manifest</button></div>
                <textarea id="exportOutput" readonly placeholder="JSON export appears here."></textarea>
            </div>
        </section>
    </main>
    <script>
        const forms = {
            '8821': 'Tax Information Authorization', '2848': 'Power of Attorney and Declaration of Representative', '1120-S': 'U.S. Income Tax Return for an S Corporation', '1099': 'Information Returns', '1040': 'U.S. Individual Income Tax Return', '4506-T': 'Request for Transcript of Tax Return'
        };
        const formNumber = document.getElementById('formNumber');
        const taxYear = document.getElementById('taxYear');
        const result = document.getElementById('lookupResult');
        const draft = document.getElementById('draftEditor');
        const output = document.getElementById('exportOutput');
        document.getElementById('lookupForm').addEventListener('click', () => {
            const key = formNumber.value.trim().toUpperCase();
            result.textContent = JSON.stringify({ formNumber: key, title: forms[key] || 'Form family lookup staged', taxYear: taxYear.value, source: 'metadata-and-template-staging', reviewRequired: true }, null, 2);
        });
        document.getElementById('buildEnvelope').addEventListener('click', () => {
            draft.value = JSON.stringify({ envelopeType: 'RossSign', formNumber: formNumber.value.trim().toUpperCase(), taxYear: taxYear.value, status: 'draft', consentRequired: true, auditHashRequired: true }, null, 2);
        });
        document.getElementById('exportManifest').addEventListener('click', () => {
            output.value = JSON.stringify({ exportedAt: new Date().toISOString(), mode: 'audit-manifest', content: draft.value, redactionCheckRequired: true }, null, 2);
        });
    </script>
</body>
</html>
