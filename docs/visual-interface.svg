<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">RTPSC ERO Workspace Visual Interface</title>
  <desc id="desc">Static visual mockup of the RTPSC ERO Workspace with navigation, status cards, ledger table, and live-feed panels.</desc>
  <defs>
    <style>
      .bg{fill:#f1f5f9}.navy{fill:#0f2c59}.gold{fill:#dac0a3}.card{fill:#fff;stroke:#e5e7eb;stroke-width:2}.text{font-family:Segoe UI,Arial,sans-serif;fill:#1f2937}.muted{fill:#64748b}.white{fill:#fff}.green{fill:#d1fae5}.greenText{fill:#065f46}.amber{fill:#fef3c7}.amberText{fill:#92400e}.red{fill:#fee2e2}.redText{fill:#991b1b}
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <rect class="navy" x="40" y="32" width="1360" height="104" rx="14"/>
  <text class="white" x="74" y="78" font-size="27" font-weight="700">RTPSC ERO Workspace — Tax Office SaaS Console</text>
  <text class="gold" x="74" y="110" font-size="16" font-weight="700">MeF E-file Transmission • TaxFirm CRM • Office Management • Reconciliation Ledger • ANDREAA AI</text>
  <text class="white" x="1185" y="70" font-size="14" font-weight="700">EFIN 748335</text>
  <text class="gold" x="1185" y="98" font-size="14">ERO / SaaS Admin</text>

  <g transform="translate(40 158)">
    <rect class="card" width="132" height="42" rx="21"/><text class="text" x="28" y="27" font-size="14" font-weight="700">Dashboard</text>
    <rect class="card" x="148" width="112" height="42" rx="21"/><text class="text" x="181" y="27" font-size="14" font-weight="700">Clients</text>
    <rect class="card" x="276" width="156" height="42" rx="21"/><text class="text" x="306" y="27" font-size="14" font-weight="700">Transmissions</text>
    <rect class="card" x="448" width="160" height="42" rx="21"/><text class="text" x="477" y="27" font-size="14" font-weight="700">Reconciliation</text>
    <rect class="card" x="624" width="102" height="42" rx="21"/><text class="text" x="656" y="27" font-size="14" font-weight="700">Office</text>
    <rect class="card" x="742" width="132" height="42" rx="21"/><text class="text" x="775" y="27" font-size="14" font-weight="700">Safeguards</text>
  </g>

  <g transform="translate(40 226)">
    <rect class="card" width="210" height="116" rx="12"/><rect class="gold" width="6" height="116" rx="3"/><text class="text" x="22" y="34" font-size="16" font-weight="700">MeF Enabled</text><text class="muted" x="22" y="62" font-size="13">Transmission staging,</text><text class="muted" x="22" y="82" font-size="13">ack review, rejection routing.</text>
    <rect class="card" x="230" width="210" height="116" rx="12"/><rect class="gold" x="230" width="6" height="116" rx="3"/><text class="text" x="252" y="34" font-size="16" font-weight="700">ERO Workspace</text><text class="muted" x="252" y="62" font-size="13">EFIN context and</text><text class="muted" x="252" y="82" font-size="13">review-gated queues.</text>
    <rect class="card" x="460" width="210" height="116" rx="12"/><rect class="gold" x="460" width="6" height="116" rx="3"/><text class="text" x="482" y="34" font-size="16" font-weight="700">TaxFirm CRM</text><text class="muted" x="482" y="62" font-size="13">Data-entry intake and</text><text class="muted" x="482" y="82" font-size="13">document tracking.</text>
    <rect class="card" x="690" width="210" height="116" rx="12"/><rect class="gold" x="690" width="6" height="116" rx="3"/><text class="text" x="712" y="34" font-size="16" font-weight="700">Office Management</text><text class="muted" x="712" y="62" font-size="13">Staff assignments and</text><text class="muted" x="712" y="82" font-size="13">compliance tasks.</text>
    <rect class="card" x="920" width="210" height="116" rx="12"/><rect class="gold" x="920" width="6" height="116" rx="3"/><text class="text" x="942" y="34" font-size="16" font-weight="700">SaaS Controls</text><text class="muted" x="942" y="62" font-size="13">OAuth gates, audit,</text><text class="muted" x="942" y="82" font-size="13">kill switches.</text>
    <rect class="card" x="1150" width="210" height="116" rx="12"/><rect class="gold" x="1150" width="6" height="116" rx="3"/><text class="text" x="1172" y="34" font-size="16" font-weight="700">ANDREAA AI</text><text class="muted" x="1172" y="62" font-size="13">Form draft and signal</text><text class="muted" x="1172" y="82" font-size="13">staging assistant.</text>
  </g>

  <rect class="card" x="40" y="376" width="880" height="466" rx="14"/>
  <text class="text" x="68" y="416" font-size="20" font-weight="700">Master Transcript Ledger</text>
  <rect class="navy" x="68" y="438" width="824" height="38" rx="6"/>
  <text class="white" x="88" y="462" font-size="13" font-weight="700">ID</text><text class="white" x="150" y="462" font-size="13" font-weight="700">Taxpayer</text><text class="white" x="405" y="462" font-size="13" font-weight="700">TC Code</text><text class="white" x="555" y="462" font-size="13" font-weight="700">Stage</text><text class="white" x="730" y="462" font-size="13" font-weight="700">Review</text>
  <g font-size="13" class="text">
    <text x="88" y="512">01</text><text x="150" y="512" font-weight="700">CONDRE D ROSS</text><text x="405" y="512">TC 570/971</text><rect class="red" x="555" y="493" width="94" height="28" rx="6"/><text class="redText" x="570" y="512" font-weight="700">HOLD</text><text x="730" y="512">Human gate</text>
    <text x="88" y="568">02</text><text x="150" y="568" font-weight="700">TASIA M PERKINS</text><text x="405" y="568">TC 570</text><rect class="red" x="555" y="549" width="94" height="28" rx="6"/><text class="redText" x="570" y="568" font-weight="700">HOLD</text><text x="730" y="568">Reconcile</text>
    <text x="88" y="624">05</text><text x="150" y="624" font-weight="700">JOURDAN RODRIGUEZ</text><text x="405" y="624">TC 846</text><rect class="green" x="555" y="605" width="94" height="28" rx="6"/><text class="greenText" x="570" y="624" font-weight="700">APPROVED</text><text x="730" y="624">Ack ready</text>
    <text x="88" y="680">06</text><text x="150" y="680" font-weight="700">CLIENT QUEUE</text><text x="405" y="680">Processing</text><rect class="amber" x="555" y="661" width="94" height="28" rx="6"/><text class="amberText" x="570" y="680" font-weight="700">QUEUE</text><text x="730" y="680">Data entry</text>
  </g>

  <rect class="card" x="950" y="376" width="450" height="466" rx="14"/>
  <text class="text" x="978" y="416" font-size="20" font-weight="700">Live Feed API</text>
  <text class="muted" x="978" y="446" font-size="13">/health • /jobs • /workspace • /services • /assistant</text>
  <rect class="green" x="978" y="474" width="180" height="34" rx="8"/><text class="greenText" x="996" y="496" font-size="14" font-weight="700">COMPLIANCE GATED</text>
  <rect class="amber" x="1176" y="474" width="172" height="34" rx="8"/><text class="amberText" x="1192" y="496" font-size="14" font-weight="700">STAGING ONLY</text>
  <text class="text" x="978" y="552" font-size="16" font-weight="700">Current Signals</text>
  <text class="muted" x="978" y="584" font-size="14">• Signed envelope required</text>
  <text class="muted" x="978" y="614" font-size="14">• ERO compliance blocker release</text>
  <text class="muted" x="978" y="644" font-size="14">• Redaction policy active</text>
  <text class="muted" x="978" y="674" font-size="14">• ANDREAA commands review-gated</text>
  <text class="muted" x="978" y="704" font-size="14">• TC570 / TC810 freeze framework</text>
</svg>
